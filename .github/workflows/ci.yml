name: CI (pnpm)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript project
        run: pnpm run check
      - name: Build client and server
        run: pnpm run build
      - name: Verify public CRM input boundaries (Vitest)
        run: pnpm exec vitest run server/crm.public-lead.schema.test.ts
      - name: Verify CRM, body limits, and homepage contracts (Node)
        run: |
          node --experimental-strip-types --test tests/crm-public-lead.test.mjs
          node --experimental-strip-types --test tests/trpc-body-limit.test.mjs
          node --test tests/home-a11y.check.mjs
